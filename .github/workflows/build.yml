name: Build plug-ins

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, windows, macos]
        default: all
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal plugins and test DSP
        run: bash scripts/build-macos.sh
      - name: Package development installer
        run: bash scripts/package-macos.sh --unsigned
      - name: Package direct-install test ZIP
        run: bash scripts/package-friend-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MoteField-macOS-universal-UNSIGNED
          path: |
            dist/installers/*
            dist/friend-test/*.zip
          if-no-files-found: error

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 plugin and test DSP
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Jobs 4
      - name: Package and verify direct-install Windows ZIP
        shell: pwsh
        run: ./scripts/package-friend-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MoteField-Windows-direct-install-ZIP
          path: dist/friend-test/MoteField-*-Windows-Test.zip*
          if-no-files-found: error
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Package development installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Unsigned
      - name: Verify installer and uninstaller
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Include friend instructions
        shell: pwsh
        run: Copy-Item 'packaging/windows/START HERE.txt' 'dist/installers/START HERE.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: MoteField-Windows-x64-UNSIGNED
          path: dist/installers/*
          if-no-files-found: error
